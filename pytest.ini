[pytest]
testpaths = tests
python_files = test_*.py
addopts = -m "not gxr_crash and not gxr_opening_crash and not gxr_control_wall_crash"
markers =
    integration: tests that instantiate the desktop UI or exercise slower integration paths
    gxr_crash: opt-in 600-case General X-ray UI state-isolation crash harness
    gxr_opening_crash: opt-in XR-21E2 opening-only parent-barrier immutability crash harness
    gxr_control_wall_crash: opt-in XR-21F control-wall-only parent-barrier immutability regression
